spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ===========================================================================
# lakehouse — единый каталог (bronze/silver/gold как namespaces)
# ===========================================================================
spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type=rest
spark.sql.catalog.lakehouse.uri=http://polaris:8181/api/catalog
spark.sql.catalog.lakehouse.warehouse=lakehouse
spark.sql.catalog.lakehouse.scope=PRINCIPAL_ROLE:ALL
spark.sql.catalog.lakehouse.delegation.enabled=false
spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint=https://storage.yandexcloud.net
spark.sql.catalog.lakehouse.s3.path-style-access=false
spark.sql.catalog.lakehouse.s3.region=ru-central1

# ===========================================================================
# Общие настройки
# ===========================================================================
spark.sql.defaultCatalog=lakehouse
spark.sql.shuffle.partitions=4
spark.sql.adaptive.enabled=true
spark.hadoop.fs.s3a.connection.ssl.enabled=true
spark.driver.extraJavaOptions=-Divy.cache.dir=/tmp -Divy.home=/tmp